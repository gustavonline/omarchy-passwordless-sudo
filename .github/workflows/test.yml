name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: ./test.sh
      - name: Current Omarchy manifest contract
        run: |
          git clone --depth 1 --branch quattro https://github.com/omacom/omarchy.git /tmp/omarchy
          bash /tmp/omarchy/bin/omarchy-plugin-validate "$PWD"
      - name: Fresh root installation in a container
        run: |
          docker build -f tests/Dockerfile -t agent-access-test .
          docker run --rm --network=none --pids-limit=128 --memory=384m agent-access-test
